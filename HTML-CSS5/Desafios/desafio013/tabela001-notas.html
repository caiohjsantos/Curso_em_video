<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

         body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
        }

        caption{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 23px;
            background-color:rgb(165, 160, 160);
            color:white;
        }
        

        th, td{
            border: 1px solid black;
            width: 100px;
            padding: 15px;
            text-align: center;
        }

        th{
            background-color: rgb(172, 167, 167);
            color: white;
        }

        .branco {
            background-color: white;
            color: black;
        }
        
        .left {
            text-align: left;
        }


    </style>
</head>
<body>
    <Table>
        <thead>
            <Caption>Notas do Primeiro Bimestre</Caption>
            <tr>
                <th rowspan="2">AREA</th>
                <th rowspan="2">DISCIPLINAS</th>
                <th colspan="2">NOTAS</th>
                <th rowspan="2">MEDIA</th>
            </tr>
            <tr>
                <th>NOTA 1</th>
                <th>NOTA 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" class="branco">EXATAS</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th colspan="4" class="left">MÉDIA DE EXATAS</th>
                <th>0.0</th>

            </tr>

            <th 
                rowspan="2" class="branco">HUMANAS
                 <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </th>


            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <th colspan="4" class="left"> MÉDIA DE HUMANAS</th>
                <th>0.0</th>
            </tr>
        </tbody>
    </Table>
</body>
</html>
