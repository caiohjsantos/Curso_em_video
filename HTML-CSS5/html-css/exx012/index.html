<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com html5</title>
</head>
<body>
    <h1>Inserindo um video hospedado localmente</h1>
    <P>Este video está hospedado no meu próprio servidor</P>
    <video width="300" poster="imagem/homem-cschorro.jpg" controls>
        <source src="midia/12796984_1080_1920_50fps.mp4" type="video/mp4">
        <source src="midia/12796984 1080 1920 50Fps.mkv" type="video/mp4">
        <p>Seu navegador não tem compatibilidade com reprodução de video.</p>
    </video>
    <h1>Inserindo video do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/72tMn9lCeiA?si=9AMtCUbP3seE4L9i" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
</body>
</html>
