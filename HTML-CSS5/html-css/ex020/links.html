<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
        SELETORES PERSONALIZADOS
        # = id
        . = class
        : = pseudo-class
        :: = pseudo-elemento
        > = children (filho)
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }
         
        a{
            color: red;
            text-decoration: none;
            font-weight: bolder ;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            text-decoration: underline;
        }

        a:active{
            color: aqua;
        }

        
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul><li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/results?search_query=curso+em+video" target="_blank">Canal do Youtube</a></li>
        <li><a href="https://www.instagram.com/romilia.silva_esteticista/">Site curso em video</a></li>
    </ul>

</body>
</html>
