<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe>
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a> <!-- O navegador não sendo compátivel, podemos colocar um link-->
        para aprender a programar
    </p>

    <p>O repositório do Guanabara

    <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>
        <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>

    também é bem legal!

    <!-- Por padrão um iframe tem o tamanho 300x150. No entanto, podemos manipulaar este tamaho tbm, mudando o height dele por exemplo.
     <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe height="500" width="500">. Lembrando que o css é soberano, portanto qualquer manipulação de estilo , sempre vai valer o que esta no css  -->
    </p>
</body>
</html>
